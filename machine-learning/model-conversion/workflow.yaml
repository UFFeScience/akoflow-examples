name: showcase-model-conversion
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - load-model
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 1Gi
      name: load-model
      runtime: showcase-model-conversion-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - export-onnx
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - load-model
      memoryLimit: 1Gi
      name: export-onnx
      runtime: showcase-model-conversion-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - export-torchscript
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - load-model
      memoryLimit: 1Gi
      name: export-torchscript
      runtime: showcase-model-conversion-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - quantize-cpu
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - export-onnx
        - export-torchscript
      memoryLimit: 1Gi
      name: quantize-cpu
      runtime: showcase-model-conversion-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - quantize-gpu
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - export-onnx
        - export-torchscript
      memoryLimit: 1Gi
      name: quantize-gpu
      runtime: showcase-model-conversion-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - validate-outputs
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - quantize-cpu
        - quantize-gpu
      memoryLimit: 1Gi
      name: validate-outputs
      runtime: showcase-model-conversion-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - publish-variants
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - validate-outputs
      memoryLimit: 1Gi
      name: publish-variants
      runtime: showcase-model-conversion-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-model-conversion:v1
  namespace: showcase
