name: opendronemap-caliterra-split-merge
spec:
  image: akoflow-local/opendronemap:workload
  activities:
  - name: split
    runtime: opendronemap-local
    cpuLimit: '2'
    memoryLimit: 6Gi
    dependsOn: []
    command:
      entrypoint: python3
      arguments:
      - /app/scripts/run_stage.py
      - --stage
      - split
      - --output
      - .
  - name: reconstruct-0
    runtime: opendronemap-local
    cpuLimit: '2'
    memoryLimit: 6Gi
    dependsOn:
    - split
    command:
      entrypoint: python3
      arguments:
      - /app/scripts/run_stage.py
      - --stage
      - reconstruct-0
      - --output
      - .
  - name: reconstruct-1
    runtime: opendronemap-local
    cpuLimit: '2'
    memoryLimit: 6Gi
    dependsOn:
    - split
    command:
      entrypoint: python3
      arguments:
      - /app/scripts/run_stage.py
      - --stage
      - reconstruct-1
      - --output
      - .
  - name: align
    runtime: opendronemap-local
    cpuLimit: '2'
    memoryLimit: 6Gi
    dependsOn:
    - split
    - reconstruct-0
    - reconstruct-1
    command:
      entrypoint: python3
      arguments:
      - /app/scripts/run_stage.py
      - --stage
      - align
      - --output
      - .
  - name: process-0
    runtime: opendronemap-local
    cpuLimit: '2'
    memoryLimit: 6Gi
    dependsOn:
    - align
    command:
      entrypoint: python3
      arguments:
      - /app/scripts/run_stage.py
      - --stage
      - process-0
      - --output
      - .
  - name: process-1
    runtime: opendronemap-local
    cpuLimit: '2'
    memoryLimit: 6Gi
    dependsOn:
    - align
    command:
      entrypoint: python3
      arguments:
      - /app/scripts/run_stage.py
      - --stage
      - process-1
      - --output
      - .
  - name: merge
    runtime: opendronemap-local
    cpuLimit: '2'
    memoryLimit: 6Gi
    dependsOn:
    - split
    - process-0
    - process-1
    command:
      entrypoint: python3
      arguments:
      - /app/scripts/run_stage.py
      - --stage
      - merge
      - --output
      - .
  - name: previews
    runtime: opendronemap-local
    cpuLimit: '2'
    memoryLimit: 6Gi
    dependsOn:
    - merge
    command:
      entrypoint: python3
      arguments:
      - /app/scripts/run_stage.py
      - --stage
      - previews
      - --output
      - .
  - name: validate
    runtime: opendronemap-local
    cpuLimit: '2'
    memoryLimit: 6Gi
    dependsOn:
    - split
    - reconstruct-0
    - reconstruct-1
    - align
    - process-0
    - process-1
    - merge
    - previews
    command:
      entrypoint: python3
      arguments:
      - /app/scripts/run_stage.py
      - --stage
      - validate
      - --output
      - .
  dataDependencies:
  - producerActivity: split
    consumerActivity: reconstruct-0
    logicalName: split.tar
    sizeBytes: 100000000
  - producerActivity: split
    consumerActivity: reconstruct-0
    logicalName: split.json
    sizeBytes: 1000000
  - producerActivity: split
    consumerActivity: reconstruct-1
    logicalName: split.tar
    sizeBytes: 100000000
  - producerActivity: split
    consumerActivity: reconstruct-1
    logicalName: split.json
    sizeBytes: 1000000
  - producerActivity: split
