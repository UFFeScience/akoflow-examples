name: showcase-experiment-feedback-loop
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-experiment-feedback-loop:v1
  activities:
    - name: experiment
      runtime: showcase-experiment-feedback-loop-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "experiment", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: model
      runtime: showcase-experiment-feedback-loop-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "model", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - experiment
    - name: next-batch
      runtime: showcase-experiment-feedback-loop-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "next-batch", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - model

