name: showcase-supervised-tool-loop
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-showcase-supervised-tool-loop:v1
  activities:
    - name: proposal
      runtime: local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "proposal", "--output", "."]
        workingDirectory: /workspace
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: approval
      runtime: local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "approval", "--output", "."]
        workingDirectory: /workspace
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - proposal
    - name: execution
      runtime: local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "execution", "--output", "."]
        workingDirectory: /workspace
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - approval
    - name: verification
      runtime: local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "verification", "--output", "."]
        workingDirectory: /workspace
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - execution

