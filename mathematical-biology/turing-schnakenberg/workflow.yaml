    - {name: simulate-primary-64, runtime: community-turing-local, command: {executable: *portable_image, entrypoint: python, arguments: [/app/workflow.py, simulate, --output, ., --branch, primary-64]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
    - {name: simulate-control-5, runtime: community-turing-local, command: {executable: *portable_image, entrypoint: python, arguments: [/app/workflow.py, simulate, --output, ., --branch, control-5]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
    - {name: simulate-control-1, runtime: community-turing-local, command: {executable: *portable_image, entrypoint: python, arguments: [/app/workflow.py, simulate, --output, ., --branch, control-1]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
