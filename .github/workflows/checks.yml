name: Example checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all_examples:
        description: Explicitly validate and build every example.
        required: false
        type: boolean
        default: false

concurrency:
  group: examples-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  dag-contract:
    name: Validate dependency runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go run ./tools/materialize -check
      - run: go test ./tools/...

  checks:
    name: Central AkôFlow example CI
    uses: UFFeScience/akoflow/.github/workflows/examples-ci.yml@main
    with:
      examples_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      examples_base_ref: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
      all_examples: ${{ inputs.all_examples || false }}
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write

  notify-documentation:
    name: Notify AkôFlow documentation
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks.outputs.has_examples == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch documentation rebuild
        env:
          GH_TOKEN: ${{ secrets.AKOFLOW_DOCS_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "AKOFLOW_DOCS_DISPATCH_TOKEN is not configured; the daily reconciliation will pick up this change."
            exit 0
          fi
          gh api repos/UFFeScience/akoflow/dispatches \
            --method POST \
            --field event_type=examples-updated \
            --field "client_payload[source_sha]=$SOURCE_SHA"
