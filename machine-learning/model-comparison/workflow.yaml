name: showcase-model-comparison
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - freeze-evaluation-set
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: freeze-evaluation-set
      runtime: showcase-model-comparison-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - evaluate-a
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - freeze-evaluation-set
      memoryLimit: 256Mi
      name: evaluate-a
      runtime: showcase-model-comparison-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - evaluate-b
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - freeze-evaluation-set
      memoryLimit: 256Mi
      name: evaluate-b
      runtime: showcase-model-comparison-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - evaluate-c
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - freeze-evaluation-set
      memoryLimit: 256Mi
      name: evaluate-c
      runtime: showcase-model-comparison-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - compare-metrics
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - evaluate-a
        - evaluate-b
        - evaluate-c
      memoryLimit: 256Mi
      name: compare-metrics
      runtime: showcase-model-comparison-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - approve-candidate
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - compare-metrics
      memoryLimit: 256Mi
      name: approve-candidate
      runtime: showcase-model-comparison-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-model-comparison:v1
  namespace: showcase
