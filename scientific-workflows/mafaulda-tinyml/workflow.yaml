name: mafaulda-tinyml
spec:
  namespace: akoflow-examples
  image: akoflow-local/mafaulda-tinyml:workload
  activities:
  - name: validate-inputs
    runtime: mafaulda-tinyml-local-local
    cpuLimit: '1'
    memoryLimit: 4Gi
    dependsOn: []
    command:
      entrypoint: python
      arguments:
      - /app/scripts/run_stage.py
      - --stage
      - validate-inputs
      - --output
      - .
  - name: features-0
    runtime: mafaulda-tinyml-local-local
    cpuLimit: '1'
    memoryLimit: 4Gi
    dependsOn:
    - validate-inputs
    command:
      entrypoint: python
      arguments:
