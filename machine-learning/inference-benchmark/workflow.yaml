name: showcase-inference-benchmark
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-inference-benchmark:v1
  activities:
    - name: cpu
      runtime: showcase-inference-benchmark-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "cpu", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: gpu
      runtime: showcase-inference-benchmark-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "gpu", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - cpu
    - name: edge
      runtime: showcase-inference-benchmark-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "edge", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - gpu
    - name: report
      runtime: showcase-inference-benchmark-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "report", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - edge

