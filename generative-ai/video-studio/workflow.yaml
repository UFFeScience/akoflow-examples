name: ai-video-studio
spec:
  activities:
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - storyboard
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: storyboard
      runtime: ai-video-studio-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - scenes
          - --output
          - .
        entrypoint: python
      cpuLimit: "2"
      dependsOn:
        - storyboard
      memoryLimit: 512Mi
      name: scenes
      runtime: ai-video-studio-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - narration
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - storyboard
      memoryLimit: 256Mi
      name: narration
      runtime: ai-video-studio-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - compose
          - --output
          - .
        entrypoint: python
      cpuLimit: "2"
      dependsOn:
        - scenes
        - narration
      memoryLimit: 512Mi
      name: compose
      runtime: ai-video-studio-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - quality-control
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - compose
      memoryLimit: 256Mi
      name: quality-control
      runtime: ai-video-studio-local
  image: ghcr.io/uffescience/akoflow-examples/ai-video-studio:v1
  namespace: showcase
