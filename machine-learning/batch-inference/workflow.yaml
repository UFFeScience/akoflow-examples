name: showcase-batch-inference
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-batch-inference:v1
  activities:
    - name: load-model
      runtime: showcase-batch-inference-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "load-model", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: split-input
      runtime: showcase-batch-inference-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "split-input", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - load-model
    - name: worker-1
      runtime: showcase-batch-inference-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "worker-1", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - split-input
    - name: worker-2
      runtime: showcase-batch-inference-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "worker-2", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - worker-1
    - name: worker-3
      runtime: showcase-batch-inference-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "worker-3", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - worker-2
    - name: worker-4
      runtime: showcase-batch-inference-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "worker-4", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - worker-3
    - name: merge
      runtime: showcase-batch-inference-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "merge", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - worker-4

