name: showcase-supervised-tool-loop
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - build-context
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: build-context
      runtime: showcase-supervised-tool-loop-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - propose-action
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - build-context
      memoryLimit: 256Mi
      name: propose-action
      runtime: showcase-supervised-tool-loop-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - policy-check
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - propose-action
      memoryLimit: 256Mi
      name: policy-check
      runtime: showcase-supervised-tool-loop-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - human-approval
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - policy-check
      memoryLimit: 256Mi
      name: human-approval
      runtime: showcase-supervised-tool-loop-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - execute-tool
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - human-approval
      memoryLimit: 256Mi
      name: execute-tool
      runtime: showcase-supervised-tool-loop-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - verify
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - execute-tool
      memoryLimit: 256Mi
      name: verify
      runtime: showcase-supervised-tool-loop-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-supervised-tool-loop:v1
  namespace: showcase
