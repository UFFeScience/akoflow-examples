name: showcase-model-comparison
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-model-comparison:v1
  activities:
    - name: dataset
      runtime: showcase-model-comparison-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "dataset", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: model-a
      runtime: showcase-model-comparison-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "model-a", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - dataset
    - name: model-b
      runtime: showcase-model-comparison-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "model-b", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - model-a
    - name: model-c
      runtime: showcase-model-comparison-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "model-c", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - model-b
    - name: comparison
      runtime: showcase-model-comparison-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "comparison", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - model-c

