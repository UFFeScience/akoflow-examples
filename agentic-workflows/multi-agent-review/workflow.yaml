name: showcase-multi-agent-review
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-multi-agent-review:v1
  activities:
    - name: researcher
      runtime: showcase-multi-agent-review-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "researcher", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: reviewer
      runtime: showcase-multi-agent-review-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "reviewer", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - researcher
    - name: critic
      runtime: showcase-multi-agent-review-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "critic", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - reviewer
    - name: synthesis
      runtime: showcase-multi-agent-review-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "synthesis", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - critic

