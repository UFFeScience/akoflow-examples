name: showcase-multi-agent-review
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - shared-context
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: shared-context
      runtime: showcase-multi-agent-review-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - research
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - shared-context
      memoryLimit: 256Mi
      name: research
      runtime: showcase-multi-agent-review-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - code
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - shared-context
      memoryLimit: 256Mi
      name: code
      runtime: showcase-multi-agent-review-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - domain
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - shared-context
      memoryLimit: 256Mi
      name: domain
      runtime: showcase-multi-agent-review-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - critic-review
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - research
        - code
        - domain
      memoryLimit: 256Mi
      name: critic-review
      runtime: showcase-multi-agent-review-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - synthesize
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - critic-review
      memoryLimit: 256Mi
      name: synthesize
      runtime: showcase-multi-agent-review-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - publish-evidence
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - synthesize
      memoryLimit: 256Mi
      name: publish-evidence
      runtime: showcase-multi-agent-review-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-multi-agent-review:v1
  namespace: showcase
