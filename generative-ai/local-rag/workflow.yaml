name: local-rag-factory
spec:
  activities:
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - ingest
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: ingest
      runtime: local-rag-factory-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - chunk
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - ingest
      memoryLimit: 256Mi
      name: chunk
      runtime: local-rag-factory-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - index
          - --output
          - .
        entrypoint: python
      cpuLimit: "2"
      dependsOn:
        - chunk
      memoryLimit: 512Mi
      name: index
      runtime: local-rag-factory-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - retrieve
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - index
      memoryLimit: 256Mi
      name: retrieve
      runtime: local-rag-factory-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - answer
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - retrieve
      memoryLimit: 256Mi
      name: answer
      runtime: local-rag-factory-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - evaluate
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - answer
      memoryLimit: 256Mi
      name: evaluate
      runtime: local-rag-factory-local
  image: ghcr.io/uffescience/akoflow-examples/local-rag-factory:v1
  namespace: showcase
