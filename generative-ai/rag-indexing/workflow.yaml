name: showcase-rag-indexing
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-rag-indexing:v1
  activities:
    - name: documents
      runtime: showcase-rag-indexing-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "documents", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: chunk
      runtime: showcase-rag-indexing-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "chunk", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - documents
    - name: embed
      runtime: showcase-rag-indexing-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "embed", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - chunk
    - name: faiss
      runtime: showcase-rag-indexing-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "faiss", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - embed
    - name: evaluate
      runtime: showcase-rag-indexing-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "evaluate", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - faiss

