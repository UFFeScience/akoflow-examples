name: showcase-model-ensemble
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-model-ensemble:v1
  activities:
    - name: dataset
      runtime: showcase-model-ensemble-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "dataset", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: rf
      runtime: showcase-model-ensemble-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "rf", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - dataset
    - name: svm
      runtime: showcase-model-ensemble-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "svm", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - rf
    - name: xgb
      runtime: showcase-model-ensemble-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "xgb", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - svm
    - name: ensemble
      runtime: showcase-model-ensemble-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "ensemble", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - xgb

