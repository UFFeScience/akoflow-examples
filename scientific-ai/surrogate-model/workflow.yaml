name: showcase-surrogate-model
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - design-samples
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: design-samples
      runtime: showcase-surrogate-model-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - simulation-a
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - design-samples
      memoryLimit: 256Mi
      name: simulation-a
      runtime: showcase-surrogate-model-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - simulation-n
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - design-samples
      memoryLimit: 256Mi
      name: simulation-n
      runtime: showcase-surrogate-model-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - assemble-dataset
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - simulation-a
        - simulation-n
      memoryLimit: 256Mi
      name: assemble-dataset
      runtime: showcase-surrogate-model-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - train-surrogate
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - assemble-dataset
      memoryLimit: 256Mi
      name: train-surrogate
      runtime: showcase-surrogate-model-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - validate
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - train-surrogate
      memoryLimit: 256Mi
      name: validate
      runtime: showcase-surrogate-model-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - publish
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - validate
      memoryLimit: 256Mi
      name: publish
      runtime: showcase-surrogate-model-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-surrogate-model:v1
  namespace: showcase
