name: showcase-anomaly-detection
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-anomaly-detection:v1
  activities:
    - name: collect-signals
      runtime: showcase-anomaly-detection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "collect-signals", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: build-features
      runtime: showcase-anomaly-detection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "build-features", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["collect-signals"]
    - name: train-detector
      runtime: showcase-anomaly-detection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "train-detector", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["build-features"]
    - name: score-validation
      runtime: showcase-anomaly-detection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "score-validation", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["train-detector"]
    - name: choose-threshold
      runtime: showcase-anomaly-detection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "choose-threshold", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["score-validation"]
    - name: publish
      runtime: showcase-anomaly-detection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "publish", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["choose-threshold"]
