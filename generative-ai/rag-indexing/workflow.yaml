name: showcase-rag-indexing
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - collect-documents
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: collect-documents
      runtime: showcase-rag-indexing-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - clean
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - collect-documents
      memoryLimit: 256Mi
      name: clean
      runtime: showcase-rag-indexing-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - chunk
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - clean
      memoryLimit: 256Mi
      name: chunk
      runtime: showcase-rag-indexing-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - embed
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - chunk
      memoryLimit: 256Mi
      name: embed
      runtime: showcase-rag-indexing-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - build-index
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - embed
      memoryLimit: 256Mi
      name: build-index
      runtime: showcase-rag-indexing-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - retrieval-tests
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - build-index
      memoryLimit: 256Mi
      name: retrieval-tests
      runtime: showcase-rag-indexing-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - answer-tests
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - build-index
      memoryLimit: 256Mi
      name: answer-tests
      runtime: showcase-rag-indexing-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - publish
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - retrieval-tests
        - answer-tests
      memoryLimit: 256Mi
      name: publish
      runtime: showcase-rag-indexing-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-rag-indexing:v1
  namespace: showcase
