    - {name: iterate-origin, runtime: community-henon-local, command: {executable: *portable_image, entrypoint: python, arguments: [/app/workflow.py, iterate, --output, ., --branch, origin]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
    - {name: iterate-x-offset, runtime: community-henon-local, command: {executable: *portable_image, entrypoint: python, arguments: [/app/workflow.py, iterate, --output, ., --branch, x-offset]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
    - {name: iterate-y-offset, runtime: community-henon-local, command: {executable: *portable_image, entrypoint: python, arguments: [/app/workflow.py, iterate, --output, ., --branch, y-offset]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
    - {name: iterate-xy-offset, runtime: community-henon-local, command: {executable: *portable_image, entrypoint: python, arguments: [/app/workflow.py, iterate, --output, ., --branch, xy-offset]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
