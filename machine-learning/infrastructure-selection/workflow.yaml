name: showcase-infrastructure-selection
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-infrastructure-selection:v1
  activities:
    - name: estimate-local
      runtime: showcase-infrastructure-selection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "estimate-local", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: estimate-cloud
      runtime: showcase-infrastructure-selection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "estimate-cloud", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - estimate-local
    - name: estimate-hpc
      runtime: showcase-infrastructure-selection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "estimate-hpc", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - estimate-cloud
    - name: decision
      runtime: showcase-infrastructure-selection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "decision", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - estimate-hpc

