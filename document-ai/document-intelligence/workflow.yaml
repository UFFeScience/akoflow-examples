name: document-intelligence
spec:
  activities:
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - ingest
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: ingest
      runtime: document-intelligence-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - classify
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - ingest
      memoryLimit: 256Mi
      name: classify
      runtime: document-intelligence-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - extract
          - --output
          - .
        entrypoint: python
      cpuLimit: "2"
      dependsOn:
        - classify
      memoryLimit: 512Mi
      name: extract
      runtime: document-intelligence-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - reconcile
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - extract
      memoryLimit: 256Mi
      name: reconcile
      runtime: document-intelligence-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - report
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - reconcile
      memoryLimit: 256Mi
      name: report
      runtime: document-intelligence-local
  image: ghcr.io/uffescience/akoflow-examples/document-intelligence:v1
  namespace: showcase
