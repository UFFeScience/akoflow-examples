name: showcase-model-distillation
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - load-teacher
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: load-teacher
      runtime: showcase-model-distillation-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - soft-labels
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - load-teacher
      memoryLimit: 256Mi
      name: soft-labels
      runtime: showcase-model-distillation-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - train-student
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - soft-labels
      memoryLimit: 256Mi
      name: train-student
      runtime: showcase-model-distillation-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - quality
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - train-student
      memoryLimit: 256Mi
      name: quality
      runtime: showcase-model-distillation-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - latency
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - train-student
      memoryLimit: 256Mi
      name: latency
      runtime: showcase-model-distillation-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - publish
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - quality
        - latency
      memoryLimit: 256Mi
      name: publish
      runtime: showcase-model-distillation-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-model-distillation:v1
  namespace: showcase
