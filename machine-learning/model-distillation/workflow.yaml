name: showcase-model-distillation
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-model-distillation:v1
  activities:
    - name: teacher
      runtime: showcase-model-distillation-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "teacher", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: generate-labels
      runtime: showcase-model-distillation-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "generate-labels", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - teacher
    - name: student
      runtime: showcase-model-distillation-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "student", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - generate-labels

