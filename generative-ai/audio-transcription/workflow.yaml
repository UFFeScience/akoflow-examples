name: showcase-audio-transcription
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - ingest-audio
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: ingest-audio
      runtime: showcase-audio-transcription-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - segment
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - ingest-audio
      memoryLimit: 256Mi
      name: segment
      runtime: showcase-audio-transcription-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - segment-1
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - segment
      memoryLimit: 256Mi
      name: segment-1
      runtime: showcase-audio-transcription-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - segment-n
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - segment
      memoryLimit: 256Mi
      name: segment-n
      runtime: showcase-audio-transcription-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - merge-transcript
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - segment-1
        - segment-n
      memoryLimit: 256Mi
      name: merge-transcript
      runtime: showcase-audio-transcription-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - summarize
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - merge-transcript
      memoryLimit: 256Mi
      name: summarize
      runtime: showcase-audio-transcription-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - publish
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - summarize
      memoryLimit: 256Mi
      name: publish
      runtime: showcase-audio-transcription-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-audio-transcription:v1
  namespace: showcase
