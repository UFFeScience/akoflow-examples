name: showcase-synthetic-dataset
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-synthetic-dataset:v1
  activities:
    - name: generate
      runtime: showcase-synthetic-dataset-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "generate", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: deduplicate
      runtime: showcase-synthetic-dataset-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "deduplicate", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - generate
    - name: quality-check
      runtime: showcase-synthetic-dataset-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "quality-check", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - deduplicate

