name: showcase-document-extraction
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-document-extraction:v1
  activities:
    - name: ingest-documents
      runtime: showcase-document-extraction-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "ingest-documents", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: ocr
      runtime: showcase-document-extraction-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "ocr", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["ingest-documents"]
    - name: native-text
      runtime: showcase-document-extraction-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "native-text", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["ingest-documents"]
    - name: classify
      runtime: showcase-document-extraction-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "classify", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["ocr","native-text"]
    - name: extract-fields
      runtime: showcase-document-extraction-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "extract-fields", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["classify"]
    - name: validate-schema
      runtime: showcase-document-extraction-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "validate-schema", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["extract-fields"]
    - name: publish
      runtime: showcase-document-extraction-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "publish", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["validate-schema"]
