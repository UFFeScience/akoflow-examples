name: blender-render-farm
spec:
  activities:
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - setup
          - --output
          - .
        entrypoint: python3
      cpuLimit: "1"
      memoryLimit: 1Gi
      name: setup
      runtime: blender-render-farm-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - render-even
          - --output
          - .
        entrypoint: python3
      cpuLimit: "2"
      dependsOn:
        - setup
      memoryLimit: 2Gi
      name: render-even
      runtime: blender-render-farm-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - render-odd
          - --output
          - .
        entrypoint: python3
      cpuLimit: "2"
      dependsOn:
        - setup
      memoryLimit: 2Gi
      name: render-odd
      runtime: blender-render-farm-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - compose
          - --output
          - .
        entrypoint: python3
      cpuLimit: "2"
      dependsOn:
        - render-even
        - render-odd
      memoryLimit: 512Mi
      name: compose
      runtime: blender-render-farm-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - verify
          - --output
          - .
        entrypoint: python3
      cpuLimit: "1"
      dependsOn:
        - compose
      memoryLimit: 256Mi
      name: verify
      runtime: blender-render-farm-local
  image: ghcr.io/uffescience/akoflow-examples/blender-render-farm:v1
  namespace: showcase
