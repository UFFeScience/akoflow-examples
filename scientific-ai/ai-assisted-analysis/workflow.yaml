name: showcase-ai-assisted-analysis
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-ai-assisted-analysis:v1
  activities:
    - name: simulation
      runtime: showcase-ai-assisted-analysis-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "simulation", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: analysis
      runtime: showcase-ai-assisted-analysis-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "analysis", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - simulation
    - name: llm-interpretation
      runtime: showcase-ai-assisted-analysis-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "llm-interpretation", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - analysis

