name: TRP reproducible image
on:
  push:
    branches: [main, AKO-44]
    paths:
      - 'scientific-workflows/trp/docker/**'
      - 'scientific-workflows/trp/scripts/**'
      - 'scientific-workflows/trp/data/**'
      - 'scientific-workflows/trp/upstream/**'
      - 'scientific-workflows/trp/requirements.txt'
      - 'scientific-workflows/trp/.dockerignore'
      - '.github/workflows/trp-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: scientific-workflows/trp
          file: scientific-workflows/trp/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/uffescience/akoflow-examples/trp:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=trp-amd64
          cache-to: type=gha,mode=max,scope=trp-amd64
      - name: Validate dependencies, frozen inputs and real metadata filtering
        run: |
          image=ghcr.io/uffescience/akoflow-examples/trp:sha-${GITHUB_SHA}
          docker run --rm --network none "$image" python /app/scripts/validate.py --definition
          mkdir -p /tmp/trp-check
          for stage in metadata-access metadata-filtering; do
            docker run --rm --network none --mount type=bind,src=/tmp/trp-check,dst=/outputs "$image" python /app/scripts/run_stage.py --stage "$stage" --output /outputs
          done
          docker run --rm --network none --mount type=bind,src=/tmp/trp-check,dst=/outputs "$image" python /app/scripts/check_metadata.py
      - name: Publish tested image
        run: |
          image=ghcr.io/uffescience/akoflow-examples/trp:sha-${GITHUB_SHA}
          docker push "$image"
          docker tag "$image" ghcr.io/uffescience/akoflow-examples/trp:v1
          docker push ghcr.io/uffescience/akoflow-examples/trp:v1
