name: showcase-batch-inference
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - load-model
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: load-model
      runtime: showcase-batch-inference-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - partition-input
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - load-model
      memoryLimit: 256Mi
      name: partition-input
      runtime: showcase-batch-inference-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - infer-shard-a
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - partition-input
      memoryLimit: 256Mi
      name: infer-shard-a
      runtime: showcase-batch-inference-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - infer-shard-b
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - partition-input
      memoryLimit: 256Mi
      name: infer-shard-b
      runtime: showcase-batch-inference-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - infer-shard-n
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - partition-input
      memoryLimit: 256Mi
      name: infer-shard-n
      runtime: showcase-batch-inference-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - merge-predictions
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - infer-shard-a
        - infer-shard-b
        - infer-shard-n
      memoryLimit: 256Mi
      name: merge-predictions
      runtime: showcase-batch-inference-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - publish
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - merge-predictions
      memoryLimit: 256Mi
      name: publish
      runtime: showcase-batch-inference-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-batch-inference:v1
  namespace: showcase
