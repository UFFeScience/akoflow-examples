name: showcase-training-with-mlflow
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-training-with-mlflow:v1
  activities:
    - name: ingest-data
      runtime: showcase-training-with-mlflow-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "ingest-data", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: validate
      runtime: showcase-training-with-mlflow-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "validate", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["ingest-data"]
    - name: train
      runtime: showcase-training-with-mlflow-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "train", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["validate"]
    - name: evaluate
      runtime: showcase-training-with-mlflow-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "evaluate", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["train"]
    - name: register-model
      runtime: showcase-training-with-mlflow-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "register-model", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["evaluate"]
    - name: log-mlflow-run
      runtime: showcase-training-with-mlflow-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "log-mlflow-run", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["evaluate"]
