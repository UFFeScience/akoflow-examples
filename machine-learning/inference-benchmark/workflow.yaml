name: showcase-inference-benchmark
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - freeze-inputs
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: freeze-inputs
      runtime: showcase-inference-benchmark-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - cpu
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - freeze-inputs
      memoryLimit: 256Mi
      name: cpu
      runtime: showcase-inference-benchmark-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - gpu
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - freeze-inputs
      memoryLimit: 256Mi
      name: gpu
      runtime: showcase-inference-benchmark-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - edge
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - freeze-inputs
      memoryLimit: 256Mi
      name: edge
      runtime: showcase-inference-benchmark-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - normalize
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - cpu
        - gpu
        - edge
      memoryLimit: 256Mi
      name: normalize
      runtime: showcase-inference-benchmark-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - compare-cost-and-latency
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - normalize
      memoryLimit: 256Mi
      name: compare-cost-and-latency
      runtime: showcase-inference-benchmark-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-inference-benchmark:v1
  namespace: showcase
