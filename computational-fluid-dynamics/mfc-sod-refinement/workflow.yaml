name: community-mfc-sod-refinement
spec:
  namespace: community-explorer
  image: akoflow/community-mfc-sod-refinement:v1
  activities:
    - {name: prepare, runtime: community-mfc-local, command: {entrypoint: python3, arguments: ["/app/workflow.py", prepare, --output, .]}, cpuLimit: "1", memoryLimit: 256Mi}
    - {name: simulate-n100, runtime: community-mfc-local, command: {entrypoint: python3, arguments: ["/app/workflow.py", simulate, --output, ., --resolution, "100"]}, cpuLimit: "1", memoryLimit: 512Mi, dependsOn: [prepare]}
    - {name: simulate-n200, runtime: community-mfc-local, command: {entrypoint: python3, arguments: ["/app/workflow.py", simulate, --output, ., --resolution, "200"]}, cpuLimit: "1", memoryLimit: 512Mi, dependsOn: [prepare]}
    - {name: simulate-n400, runtime: community-mfc-local, command: {entrypoint: python3, arguments: ["/app/workflow.py", simulate, --output, ., --resolution, "400"]}, cpuLimit: "1", memoryLimit: 512Mi, dependsOn: [prepare]}
    - {name: simulate-n800, runtime: community-mfc-local, command: {entrypoint: python3, arguments: ["/app/workflow.py", simulate, --output, ., --resolution, "800"]}, cpuLimit: "1", memoryLimit: 512Mi, dependsOn: [prepare]}
    - {name: measure-n100, runtime: community-mfc-local, command: {entrypoint: python3, arguments: ["/app/workflow.py", measure, --input, ., --output, ., --resolution, "100"]}, cpuLimit: "1", memoryLimit: 256Mi, dependsOn: [simulate-n100]}
    - {name: measure-n200, runtime: community-mfc-local, command: {entrypoint: python3, arguments: ["/app/workflow.py", measure, --input, ., --output, ., --resolution, "200"]}, cpuLimit: "1", memoryLimit: 256Mi, dependsOn: [simulate-n200]}
    - {name: measure-n400, runtime: community-mfc-local, command: {entrypoint: python3, arguments: ["/app/workflow.py", measure, --input, ., --output, ., --resolution, "400"]}, cpuLimit: "1", memoryLimit: 256Mi, dependsOn: [simulate-n400]}
    - {name: measure-n800, runtime: community-mfc-local, command: {entrypoint: python3, arguments: ["/app/workflow.py", measure, --input, ., --output, ., --resolution, "800"]}, cpuLimit: "1", memoryLimit: 256Mi, dependsOn: [simulate-n800]}
    - {name: aggregate, runtime: community-mfc-local, command: {entrypoint: python3, arguments: ["/app/workflow.py", aggregate, --input, ., --output, .]}, cpuLimit: "1", memoryLimit: 512Mi, dependsOn: [measure-n100, measure-n200, measure-n400, measure-n800]}
    - {name: animate, runtime: community-mfc-local, command: {entrypoint: python3, arguments: ["/app/workflow.py", animate, --input, ., --output, .]}, cpuLimit: "1", memoryLimit: 512Mi, dependsOn: [simulate-n800]}
    - {name: validate, runtime: community-mfc-local, command: {entrypoint: python3, arguments: ["/app/workflow.py", validate, --input, ., --output, .]}, cpuLimit: "1", memoryLimit: 512Mi, dependsOn: [aggregate, animate]}

