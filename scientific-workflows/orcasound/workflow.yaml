name: orcasound
spec:
  activities:
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - acquire
          - --output
          - .
        entrypoint: python3
      cpuLimit: "1"
      dependsOn: []
      memoryLimit: 2Gi
      name: acquire
      runtime: orcasound-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - convert
          - --output
          - .
          - --part
          - "0"
        entrypoint: python3
      cpuLimit: "1"
      dependsOn:
        - acquire
      memoryLimit: 2Gi
      name: convert-0
      runtime: orcasound-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - spectrogram
          - --output
          - .
          - --part
          - "0"
        entrypoint: python3
      cpuLimit: "1"
      dependsOn:
        - convert-0
      memoryLimit: 2Gi
      name: spectrogram-0
      runtime: orcasound-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - predict
          - --output
          - .
          - --part
          - "0"
        entrypoint: python3
      cpuLimit: "2"
      dependsOn:
        - convert-0
        - acquire
      memoryLimit: 4Gi
      name: predict-0
      runtime: orcasound-local
    - command:
