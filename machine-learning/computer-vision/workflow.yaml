name: showcase-computer-vision
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - collect-images
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: collect-images
      runtime: showcase-computer-vision-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - import-labels
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - collect-images
      memoryLimit: 256Mi
      name: import-labels
      runtime: showcase-computer-vision-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - augment
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - import-labels
      memoryLimit: 256Mi
      name: augment
      runtime: showcase-computer-vision-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - train-detector
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - augment
      memoryLimit: 256Mi
      name: train-detector
      runtime: showcase-computer-vision-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - evaluate
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - train-detector
      memoryLimit: 256Mi
      name: evaluate
      runtime: showcase-computer-vision-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - package-model
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - evaluate
      memoryLimit: 256Mi
      name: package-model
      runtime: showcase-computer-vision-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-computer-vision:v1
  namespace: showcase
