name: OpenOil multi-platform image
on:
  push:
    branches: [main, AKO-27]
    paths: ['images/openoil/**', '.github/workflows/openoil-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/openoil
          file: images/openoil/docker/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: ghcr.io/uffescience/openoil-ensemble:sha-${{ github.sha }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=openoil-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=openoil-${{ matrix.architecture }}
      - name: Validate real offline OpenOil computation
        run: |
          docker run --rm --network none --memory 5g ghcr.io/uffescience/openoil-ensemble:sha-${GITHUB_SHA}-${{ matrix.architecture }} sh -ec '
            for stage in prepare member-000 member-001 aggregate map summary animate validate; do
              python /opt/openoil/workflow.py --stage "$stage" --members 2 --particles 32 --hours 2
            done'
      - name: Publish tested architecture
        run: docker push ghcr.io/uffescience/openoil-ensemble:sha-${GITHUB_SHA}-${{ matrix.architecture }}
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish combined ARM64 and AMD64 manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/uffescience/openoil-ensemble:sha-${GITHUB_SHA} \
            -t ghcr.io/uffescience/openoil-ensemble:v1 \
            ghcr.io/uffescience/openoil-ensemble:sha-${GITHUB_SHA}-amd64 \
            ghcr.io/uffescience/openoil-ensemble:sha-${GITHUB_SHA}-arm64
          docker buildx imagetools inspect ghcr.io/uffescience/openoil-ensemble:v1
