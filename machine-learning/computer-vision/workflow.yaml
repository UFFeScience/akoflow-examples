name: showcase-computer-vision
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-computer-vision:v1
  activities:
    - name: augment
      runtime: local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "augment", "--output", "."]
        workingDirectory: /workspace
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: train
      runtime: local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "train", "--output", "."]
        workingDirectory: /workspace
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - augment
    - name: evaluate
      runtime: local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "evaluate", "--output", "."]
        workingDirectory: /workspace
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - train

