name: showcase-surrogate-model
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-surrogate-model:v1
  activities:
    - name: design-samples
      runtime: showcase-surrogate-model-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "design-samples", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: simulation-a
      runtime: showcase-surrogate-model-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "simulation-a", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["design-samples"]
    - name: simulation-n
      runtime: showcase-surrogate-model-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "simulation-n", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["design-samples"]
    - name: assemble-dataset
      runtime: showcase-surrogate-model-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "assemble-dataset", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["simulation-a","simulation-n"]
    - name: train-surrogate
      runtime: showcase-surrogate-model-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "train-surrogate", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["assemble-dataset"]
    - name: validate
      runtime: showcase-surrogate-model-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "validate", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["train-surrogate"]
    - name: publish
      runtime: showcase-surrogate-model-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "publish", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["validate"]
