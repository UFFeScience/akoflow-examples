name: showcase-audio-transcription
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-audio-transcription:v1
  activities:
    - name: audio
      runtime: showcase-audio-transcription-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "audio", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: split
      runtime: showcase-audio-transcription-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "split", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - audio
    - name: transcribe
      runtime: showcase-audio-transcription-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "transcribe", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - split
    - name: summarize
      runtime: showcase-audio-transcription-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "summarize", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - transcribe

