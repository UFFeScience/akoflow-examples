name: showcase-hyperparameter-search
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-hyperparameter-search:v1
  activities:
    - name: load
      runtime: showcase-hyperparameter-search-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "load", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: preprocess
      runtime: showcase-hyperparameter-search-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "preprocess", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - load
    - name: rf-1
      runtime: showcase-hyperparameter-search-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "rf-1", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - preprocess
    - name: rf-2
      runtime: showcase-hyperparameter-search-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "rf-2", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - rf-1
    - name: rf-3
      runtime: showcase-hyperparameter-search-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "rf-3", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - rf-2
    - name: rf-4
      runtime: showcase-hyperparameter-search-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "rf-4", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - rf-3
    - name: compare
      runtime: showcase-hyperparameter-search-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "compare", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - rf-4
    - name: best-model
      runtime: showcase-hyperparameter-search-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "best-model", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - compare

