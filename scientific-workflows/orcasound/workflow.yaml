      name: spectrogram-1
      runtime: orcasound-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - predict
          - --output
          - .
          - --part
          - "1"
        entrypoint: python3
      cpuLimit: "2"
      dependsOn:
        - convert-1
        - acquire
      memoryLimit: 4Gi
      name: predict-1
      runtime: orcasound-local
