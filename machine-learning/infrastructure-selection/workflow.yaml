name: showcase-infrastructure-selection
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-infrastructure-selection:v1
  activities:
    - name: profile-workload
      runtime: showcase-infrastructure-selection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "profile-workload", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: local-gpu
      runtime: showcase-infrastructure-selection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "local-gpu", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["profile-workload"]
    - name: hpc
      runtime: showcase-infrastructure-selection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "hpc", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["profile-workload"]
    - name: cloud
      runtime: showcase-infrastructure-selection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "cloud", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["profile-workload"]
    - name: compare-plans
      runtime: showcase-infrastructure-selection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "compare-plans", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["local-gpu","hpc","cloud"]
    - name: select-scope
      runtime: showcase-infrastructure-selection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "select-scope", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["compare-plans"]
    - name: train
      runtime: showcase-infrastructure-selection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "train", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["select-scope"]
