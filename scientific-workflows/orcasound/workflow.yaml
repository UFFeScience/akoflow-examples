          - /app/scripts/run_stage.py
          - --stage
          - spectrogram
          - --output
          - .
          - --part
          - "2"
        entrypoint: python3
      cpuLimit: "1"
      dependsOn:
        - convert-2
      memoryLimit: 2Gi
      name: spectrogram-2
      runtime: orcasound-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - predict
          - --output
          - .
          - --part
          - "2"
        entrypoint: python3
      cpuLimit: "2"
      dependsOn:
        - convert-2
        - acquire
      memoryLimit: 4Gi
      name: predict-2
      runtime: orcasound-local
    - command:
