name: showcase-bounded-agent
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-bounded-agent:v1
  activities:
    - name: goal
      runtime: showcase-bounded-agent-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "goal", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: agent
      runtime: showcase-bounded-agent-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "agent", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - goal
    - name: validator
      runtime: showcase-bounded-agent-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "validator", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - agent

