    - {name: evaluate-550nm, runtime: community-airy-local, command: {executable: *portable_image, entrypoint: python, arguments: [/app/workflow.py, evaluate, --output, ., --branch, 550nm]}, cpuLimit: "1", memoryLimit: 256Mi, dependsOn: [prepare-manifest]}
    - {name: evaluate-650nm, runtime: community-airy-local, command: {executable: *portable_image, entrypoint: python, arguments: [/app/workflow.py, evaluate, --output, ., --branch, 650nm]}, cpuLimit: "1", memoryLimit: 256Mi, dependsOn: [prepare-manifest]}
