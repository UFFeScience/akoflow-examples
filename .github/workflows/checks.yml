name: Example checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Central AkôFlow example CI
    uses: UFFeScience/akoflow/.github/workflows/examples-ci.yml@main
    with:
      examples_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write

  notify-documentation:
    name: Notify AkôFlow documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch documentation rebuild
        env:
          GH_TOKEN: ${{ secrets.AKOFLOW_DOCS_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "AKOFLOW_DOCS_DISPATCH_TOKEN is not configured; the daily reconciliation will pick up this change."
            exit 0
          fi
          gh api repos/UFFeScience/akoflow/dispatches \
            --method POST \
            --field event_type=examples-updated \
            --field "client_payload[source_sha]=$SOURCE_SHA"
