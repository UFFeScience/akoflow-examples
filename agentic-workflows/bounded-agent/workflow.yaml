name: showcase-bounded-agent
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-bounded-agent:v1
  activities:
    - name: prepare-objective
      runtime: showcase-bounded-agent-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "prepare-objective", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: agent-loop
      runtime: showcase-bounded-agent-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "agent-loop", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["prepare-objective"]
    - name: validate-output
      runtime: showcase-bounded-agent-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "validate-output", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["agent-loop"]
    - name: publish-result
      runtime: showcase-bounded-agent-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "publish-result", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["validate-output"]
    - name: store-trace
      runtime: showcase-bounded-agent-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "store-trace", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["validate-output"]
