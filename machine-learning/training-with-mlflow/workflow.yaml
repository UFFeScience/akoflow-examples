name: showcase-training-with-mlflow
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - ingest-data
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 1Gi
      name: ingest-data
      runtime: showcase-training-with-mlflow-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - validate
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - ingest-data
      memoryLimit: 1Gi
      name: validate
      runtime: showcase-training-with-mlflow-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - train
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - validate
      memoryLimit: 1Gi
      name: train
      runtime: showcase-training-with-mlflow-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - evaluate
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - train
      memoryLimit: 1Gi
      name: evaluate
      runtime: showcase-training-with-mlflow-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - register-model
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - evaluate
      memoryLimit: 1Gi
      name: register-model
      runtime: showcase-training-with-mlflow-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - log-mlflow-run
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - evaluate
      memoryLimit: 1Gi
      name: log-mlflow-run
      runtime: showcase-training-with-mlflow-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-training-with-mlflow:v1
  namespace: showcase
