name: showcase-experiment-feedback-loop
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - observations
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: observations
      runtime: showcase-experiment-feedback-loop-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - update-model
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - observations
      memoryLimit: 256Mi
      name: update-model
      runtime: showcase-experiment-feedback-loop-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - propose-experiments
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - update-model
      memoryLimit: 256Mi
      name: propose-experiments
      runtime: showcase-experiment-feedback-loop-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - safety-check
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - propose-experiments
      memoryLimit: 256Mi
      name: safety-check
      runtime: showcase-experiment-feedback-loop-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - run-experiments
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - safety-check
      memoryLimit: 256Mi
      name: run-experiments
      runtime: showcase-experiment-feedback-loop-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - record-observations
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - run-experiments
      memoryLimit: 256Mi
      name: record-observations
      runtime: showcase-experiment-feedback-loop-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-experiment-feedback-loop:v1
  namespace: showcase
