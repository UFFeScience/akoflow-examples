name: showcase-model-conversion
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-model-conversion:v1
  activities:
    - name: onnx
      runtime: showcase-model-conversion-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "onnx", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: gguf
      runtime: showcase-model-conversion-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "gguf", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - onnx
    - name: tensorrt
      runtime: showcase-model-conversion-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "tensorrt", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - gguf

