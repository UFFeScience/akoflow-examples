name: showcase-lora-fine-tuning
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-lora-fine-tuning:v1
  activities:
    - name: prepare
      runtime: local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "prepare", "--output", "."]
        workingDirectory: /workspace
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: finetune
      runtime: local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "finetune", "--output", "."]
        workingDirectory: /workspace
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - prepare
    - name: evaluate
      runtime: local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "evaluate", "--output", "."]
        workingDirectory: /workspace
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - finetune

