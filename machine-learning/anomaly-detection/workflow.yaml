name: showcase-anomaly-detection
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-anomaly-detection:v1
  activities:
    - name: generate-data
      runtime: showcase-anomaly-detection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "generate-data", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: feature-engineering
      runtime: showcase-anomaly-detection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "feature-engineering", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - generate-data
    - name: train
      runtime: showcase-anomaly-detection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "train", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - feature-engineering
    - name: score
      runtime: showcase-anomaly-detection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "score", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - train
    - name: threshold
      runtime: showcase-anomaly-detection-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "threshold", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - score

