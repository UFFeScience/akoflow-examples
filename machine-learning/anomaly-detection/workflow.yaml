name: showcase-anomaly-detection
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - collect-signals
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: collect-signals
      runtime: showcase-anomaly-detection-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - build-features
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - collect-signals
      memoryLimit: 256Mi
      name: build-features
      runtime: showcase-anomaly-detection-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - train-detector
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - build-features
      memoryLimit: 256Mi
      name: train-detector
      runtime: showcase-anomaly-detection-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - score-validation
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - train-detector
      memoryLimit: 256Mi
      name: score-validation
      runtime: showcase-anomaly-detection-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - choose-threshold
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - score-validation
      memoryLimit: 256Mi
      name: choose-threshold
      runtime: showcase-anomaly-detection-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - publish
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - choose-threshold
      memoryLimit: 256Mi
      name: publish
      runtime: showcase-anomaly-detection-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-anomaly-detection:v1
  namespace: showcase
