name: showcase-surrogate-model
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-surrogate-model:v1
  activities:
    - name: simulation
      runtime: showcase-surrogate-model-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "simulation", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: dataset
      runtime: showcase-surrogate-model-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "dataset", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - simulation
    - name: train-surrogate
      runtime: showcase-surrogate-model-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "train-surrogate", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - dataset

