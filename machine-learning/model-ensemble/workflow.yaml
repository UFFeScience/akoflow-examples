name: showcase-model-ensemble
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - prepare-input
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: prepare-input
      runtime: showcase-model-ensemble-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - predict-a
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - prepare-input
      memoryLimit: 256Mi
      name: predict-a
      runtime: showcase-model-ensemble-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - predict-b
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - prepare-input
      memoryLimit: 256Mi
      name: predict-b
      runtime: showcase-model-ensemble-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - predict-c
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - prepare-input
      memoryLimit: 256Mi
      name: predict-c
      runtime: showcase-model-ensemble-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - combine
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - predict-a
        - predict-b
        - predict-c
      memoryLimit: 256Mi
      name: combine
      runtime: showcase-model-ensemble-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - evaluate
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - combine
      memoryLimit: 256Mi
      name: evaluate
      runtime: showcase-model-ensemble-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - publish
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - evaluate
      memoryLimit: 256Mi
      name: publish
      runtime: showcase-model-ensemble-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-model-ensemble:v1
  namespace: showcase
