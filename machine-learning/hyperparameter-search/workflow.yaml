name: showcase-hyperparameter-search
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - prepare-dataset
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: prepare-dataset
      runtime: showcase-hyperparameter-search-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - trial-1
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - prepare-dataset
      memoryLimit: 256Mi
      name: trial-1
      runtime: showcase-hyperparameter-search-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - trial-2
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - prepare-dataset
      memoryLimit: 256Mi
      name: trial-2
      runtime: showcase-hyperparameter-search-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - trial-n
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - prepare-dataset
      memoryLimit: 256Mi
      name: trial-n
      runtime: showcase-hyperparameter-search-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - compare-trials
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - trial-1
        - trial-2
        - trial-n
      memoryLimit: 256Mi
      name: compare-trials
      runtime: showcase-hyperparameter-search-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - register-best
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - compare-trials
      memoryLimit: 256Mi
      name: register-best
      runtime: showcase-hyperparameter-search-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-hyperparameter-search:v1
  namespace: showcase
