name: showcase-synthetic-dataset
spec:
  activities:
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - define-schema
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      memoryLimit: 256Mi
      name: define-schema
      runtime: showcase-synthetic-dataset-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - batch-a
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - define-schema
      memoryLimit: 256Mi
      name: batch-a
      runtime: showcase-synthetic-dataset-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - batch-b
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - define-schema
      memoryLimit: 256Mi
      name: batch-b
      runtime: showcase-synthetic-dataset-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - batch-n
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - define-schema
      memoryLimit: 256Mi
      name: batch-n
      runtime: showcase-synthetic-dataset-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - filter
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - batch-a
        - batch-b
        - batch-n
      memoryLimit: 256Mi
      name: filter
      runtime: showcase-synthetic-dataset-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - deduplicate
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - filter
      memoryLimit: 256Mi
      name: deduplicate
      runtime: showcase-synthetic-dataset-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - quality-review
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - deduplicate
      memoryLimit: 256Mi
      name: quality-review
      runtime: showcase-synthetic-dataset-local
    - command:
        arguments:
          - /app/run_showcase.py
          - --stage
          - publish
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - quality-review
      memoryLimit: 256Mi
      name: publish
      runtime: showcase-synthetic-dataset-local
  image: ghcr.io/uffescience/akoflow-examples/showcase-synthetic-dataset:v1
  namespace: showcase
