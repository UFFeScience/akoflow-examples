name: video-intelligence
spec:
  activities:
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - prepare
          - --output
          - .
        entrypoint: python
      cpuLimit: "2"
      memoryLimit: 512Mi
      name: prepare
      runtime: video-intelligence-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - probe
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - prepare
      memoryLimit: 256Mi
      name: probe
      runtime: video-intelligence-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - scenes
          - --output
          - .
        entrypoint: python
      cpuLimit: "2"
      dependsOn:
        - prepare
      memoryLimit: 512Mi
      name: scenes
      runtime: video-intelligence-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - audio
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - prepare
      memoryLimit: 256Mi
      name: audio
      runtime: video-intelligence-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - timeline
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - probe
        - scenes
        - audio
      memoryLimit: 256Mi
      name: timeline
      runtime: video-intelligence-local
    - command:
        arguments:
          - /app/scripts/pipeline.py
          - --stage
          - report
          - --output
          - .
        entrypoint: python
      cpuLimit: "1"
      dependsOn:
        - timeline
      memoryLimit: 256Mi
      name: report
      runtime: video-intelligence-local
  image: ghcr.io/uffescience/akoflow-examples/video-intelligence:v1
  namespace: showcase
