name: showcase-model-comparison
spec:
  namespace: showcase
  # AkôFlow starts this OCI image; activities only declare commands inside it.
  image: ghcr.io/uffescience/akoflow-examples/showcase-model-comparison:v1
  activities:
    - name: freeze-evaluation-set
      runtime: showcase-model-comparison-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "freeze-evaluation-set", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: evaluate-a
      runtime: showcase-model-comparison-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "evaluate-a", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["freeze-evaluation-set"]
    - name: evaluate-b
      runtime: showcase-model-comparison-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "evaluate-b", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["freeze-evaluation-set"]
    - name: evaluate-c
      runtime: showcase-model-comparison-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "evaluate-c", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["freeze-evaluation-set"]
    - name: compare-metrics
      runtime: showcase-model-comparison-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "compare-metrics", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["evaluate-a","evaluate-b","evaluate-c"]
    - name: approve-candidate
      runtime: showcase-model-comparison-local
      command:
        entrypoint: python
        arguments: ["/app/run_showcase.py", "--stage", "approve-candidate", "--output", "."]
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn: ["compare-metrics"]
