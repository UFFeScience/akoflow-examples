name: community-ising-yang-v1
spec:
  namespace: community-explorer
  image: akoflow/community-ising-yang:v1
  activities:
    - {name: prepare-scenario, runtime: community-ising-local, command: {entrypoint: python, arguments: [/app/workflow.py, prepare, --output, .]}, cpuLimit: "1", memoryLimit: 1Gi}
    - {name: sample-shard-0, runtime: community-ising-local, command: {entrypoint: python, arguments: [/app/workflow.py, sample, --output, ., --shard, "0"]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
    - {name: sample-shard-1, runtime: community-ising-local, command: {entrypoint: python, arguments: [/app/workflow.py, sample, --output, ., --shard, "1"]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
    - {name: sample-shard-2, runtime: community-ising-local, command: {entrypoint: python, arguments: [/app/workflow.py, sample, --output, ., --shard, "2"]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
    - {name: sample-shard-3, runtime: community-ising-local, command: {entrypoint: python, arguments: [/app/workflow.py, sample, --output, ., --shard, "3"]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
    - {name: sample-shard-4, runtime: community-ising-local, command: {entrypoint: python, arguments: [/app/workflow.py, sample, --output, ., --shard, "4"]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
    - {name: sample-shard-5, runtime: community-ising-local, command: {entrypoint: python, arguments: [/app/workflow.py, sample, --output, ., --shard, "5"]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
    - {name: sample-shard-6, runtime: community-ising-local, command: {entrypoint: python, arguments: [/app/workflow.py, sample, --output, ., --shard, "6"]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
    - {name: sample-shard-7, runtime: community-ising-local, command: {entrypoint: python, arguments: [/app/workflow.py, sample, --output, ., --shard, "7"]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [prepare-scenario]}
    - {name: aggregate-observables, runtime: community-ising-local, command: {entrypoint: python, arguments: [/app/workflow.py, aggregate, --output, .]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [sample-shard-0, sample-shard-1, sample-shard-2, sample-shard-3, sample-shard-4, sample-shard-5, sample-shard-6, sample-shard-7]}
    - {name: render-results, runtime: community-ising-local, command: {entrypoint: python, arguments: [/app/workflow.py, render, --output, .]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [aggregate-observables]}
    - {name: validate, runtime: community-ising-local, command: {entrypoint: python, arguments: [/app/workflow.py, validate, --output, .]}, cpuLimit: "1", memoryLimit: 1Gi, dependsOn: [render-results]}
