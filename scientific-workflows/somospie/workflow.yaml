name: somospie
spec:
  activities:
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - acquire
          - --output
          - .
        entrypoint: python3
      cpuLimit: "1"
      dependsOn: []
      memoryLimit: 2Gi
      name: acquire
      runtime: somospie-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - moisture
          - --output
          - .
        entrypoint: python3
      cpuLimit: "1"
      dependsOn:
        - acquire
      memoryLimit: 2Gi
      name: moisture
      runtime: somospie-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - mosaic
          - --output
          - .
        entrypoint: python3
      cpuLimit: "1"
      dependsOn:
        - acquire
      memoryLimit: 2Gi
      name: mosaic
      runtime: somospie-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - terrain
          - --output
          - .
        entrypoint: python3
      cpuLimit: "1"
      dependsOn:
        - mosaic
      memoryLimit: 2Gi
      name: terrain
      runtime: somospie-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - train-table
          - --output
          - .
        entrypoint: python3
      cpuLimit: "1"
      dependsOn:
        - moisture
        - terrain
      memoryLimit: 2Gi
      name: train-table
      runtime: somospie-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - eval-table
          - --output
          - .
        entrypoint: python3
      cpuLimit: "1"
      dependsOn:
        - terrain
      memoryLimit: 2Gi
      name: eval-table
      runtime: somospie-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - train
          - --output
          - .
          - --model
          - knn
        entrypoint: python3
      cpuLimit: "2"
      dependsOn:
        - train-table
      memoryLimit: 4Gi
      name: train-knn
      runtime: somospie-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - predict
          - --output
          - .
          - --model
          - knn
        entrypoint: python3
      cpuLimit: "2"
      dependsOn:
        - train-knn
        - eval-table
      memoryLimit: 4Gi
      name: predict-knn
      runtime: somospie-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - train
          - --output
          - .
          - --model
          - rf
        entrypoint: python3
      cpuLimit: "2"
      dependsOn:
        - train-table
      memoryLimit: 4Gi
      name: train-rf
      runtime: somospie-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - predict
          - --output
          - .
          - --model
          - rf
        entrypoint: python3
      cpuLimit: "2"
      dependsOn:
        - train-rf
        - eval-table
      memoryLimit: 4Gi
      name: predict-rf
      runtime: somospie-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - diagnostics
          - --output
          - .
        entrypoint: python3
      cpuLimit: "1"
      dependsOn:
        - train-knn
        - predict-knn
        - train-rf
        - predict-rf
        - moisture
        - terrain
        - train-table
        - eval-table
      memoryLimit: 2Gi
      name: diagnostics
      runtime: somospie-local
    - command:
        arguments:
          - /app/scripts/run_stage.py
          - --stage
          - package
          - --output
          - .
        entrypoint: python3
      cpuLimit: "1"
      dependsOn:
        - diagnostics
      memoryLimit: 2Gi
      name: package
      runtime: somospie-local
  dataDependencies:
    - consumerActivity: moisture
      logicalName: raw-observations.tar.gz
      producerActivity: acquire
      sizeBytes: 1
    - consumerActivity: mosaic
      logicalName: raw-observations.tar.gz
